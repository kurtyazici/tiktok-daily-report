  *{box-sizing:border-box;margin:0;padding:0}

  h1{font-size:24px;letter-spacing:-0.02em}
  .hdr-right{display:flex;align-items:center;gap:10px}
  .badge{display:inline-block;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--chip);color:var(--chip-text)}
  .theme-btn{border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;border-radius:999px;padding:5px 12px;cursor:pointer;box-shadow:var(--shadow)}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
  .links a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 12px;box-shadow:var(--shadow)}
  .links a:hover{border-color:var(--prod-active)}
  .links .k{font-size:11px;color:var(--muted);font-weight:500}
  .viewnav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:12px}
  .viewnav button{border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:700;padding:9px 18px;border-radius:10px;cursor:pointer;box-shadow:var(--shadow)}
  .viewnav button.active{background:var(--tab-active);color:var(--tab-active-text);border-color:var(--tab-active)}
  .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
  .prodtabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .prodtabs button{border:1px solid var(--border);background:var(--prod);color:var(--prod-text);font-size:13.5px;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer;box-shadow:var(--shadow)}
  .prodtabs button.active{background:var(--prod-active);color:#fff;border-color:var(--prod-active)}
  .prodtabs button .px{font-weight:500;opacity:.8;font-size:12px}
  .tabs{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
  .tabs button{border:none;background:var(--tab);color:var(--text);font-size:13.5px;font-weight:600;padding:8px 18px;cursor:pointer}
  .tabs button.active{background:var(--tab-active);color:var(--tab-active-text)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:20px}
  .legend span{display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .hero{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 26px;margin-bottom:18px;display:flex;flex-wrap:wrap;align-items:center;gap:28px;box-shadow:var(--shadow)}
  .hero .big{font-size:44px;font-weight:700;letter-spacing:-0.03em}
  .hero .label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .hero-side{flex:1;min-width:260px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px 10px;box-shadow:var(--shadow)}
  .card.blend{border-style:dashed}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .card h3{font-size:13.5px;font-weight:600;color:var(--text);opacity:.85}
  .val{font-size:26px;font-weight:700;letter-spacing:-0.02em;margin-top:6px}
  .delta{font-size:12.5px;font-weight:600;margin-top:2px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .tgt{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .tgt.above{background:var(--green-soft);color:var(--green)}
  .tgt.below{background:var(--red-soft);color:var(--red)}
  .tgt.neutral{background:var(--neutral-soft);color:var(--muted)}
  .tgt.sync{background:var(--amber-soft);color:var(--amber)}
  .tgt.blend{background:var(--prod);color:var(--prod-text)}
  .spark{margin-top:8px;width:100%;height:64px}
  .funnel{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:4px}
  .fcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .fcard .fl{font-size:12.5px;font-weight:600;color:var(--muted)}
  .fcard .fv{font-size:28px;font-weight:700;letter-spacing:-0.02em;margin-top:4px}
  .fcard .fs{font-size:11.5px;color:var(--muted);margin-top:2px}
  table.lead{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  table.lead th,table.lead td{padding:11px 14px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--border)}
  table.lead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  table.lead td.r,table.lead th.r{text-align:right}
  table.lead tr:last-child td{border-bottom:none}
  table.lead .rank{color:var(--muted);font-weight:700;width:34px}
  table.lead .hd{font-weight:700}
  .up{color:var(--green)} .down{color:var(--red)}
  footer{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.7}
  .note{color:var(--amber);font-weight:600}
  .src{font-size:11px;color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted)}
  .src:hover{color:var(--prod-active);border-color:var(--prod-active)}
  .hide{display:none}
</style>

function css(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}
function spark(data, good, avgVal, extraH){
  const w=280,h=extraH||64,p=4;
  const max=Math.max(...data,avgVal), min=Math.min(...data,avgVal);
  const x=i=>p+i*(w-2*p)/(data.length-1);
  const y=v=>max===min?h/2:h-p-(v-min)*(h-2*p)/(max-min);
  const color=good===null?css('--muted'):(good?css('--green'):css('--red'));
  const pts=data.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area=`M${x(0)},${h-p} L${pts.replace(/ /g," L")} L${x(data.length-1)},${h-p} Z`;
  return `<svg class="spark" style="height:${h}px" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${area}" fill="${color}" opacity="0.09"/>
    <line x1="${p}" x2="${w-p}" y1="${y(avgVal).toFixed(1)}" y2="${y(avgVal).toFixed(1)}" stroke="${css('--avgline')}" stroke-width="1" stroke-dasharray="4 3"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(data.length-1).toFixed(1)}" cy="${y(data[data.length-1]).toFixed(1)}" r="3" fill="${color}"/>
  </svg>`;
}
function deltaTxt(cur,prev,fmt,vsLabel){
  if(prev===0) return {txt:"— no prior base",cls:"flat"};
  const pct=(cur-prev)/prev*100, up=pct>=0;
  return {txt:`${up?"↑":"↓"} ${Math.abs(pct).toFixed(1)}% ${vsLabel} (${fmt(prev)})`, cls:up?"up":"down"};
}
function ydayLagged(m, seg){
  if(m.blend) return false;
  const sd=SEG[seg];
  const attrLag = sd.GMV.s[29]>0 && sd.AFF.s[29]===0;
  if(m.k==="AFF"||m.k==="VID"||m.k==="LIVE") return attrLag;
  if(m.k==="VIEWS") return sd.GMV.s[29]>0 && sd.VIEWS.s[29]===0;
  return false;
}
const SRC_TT_ADS={l:"TikTok GMV Max",u:"https://seller-us.tiktok.com/marketing"};
const SRC_CRUVA={l:"Cruva",u:"https://app.cruva.com"};
function srcLink(k){
  const s=(k==="SPEND"||k==="GMVMAX"||k==="ROAS")?SRC_TT_ADS:SRC_CRUVA;
  return `<div style="margin-top:3px"><a class="src" href="${s.u}" target="_blank" rel="noopener">source: ${s.l} ↗</a></div>`;
}
function metricCard(m, seg, period){
  const d = m.blend ? BLENDED[m.k] : SEG[seg][m.k];
  const isBlendProd = m.blend && seg!=="all";
  const a=avg(d.s);
  let val, dl, tgtCls, tgtTxt, series, good, sub="";
  if(period==="d30"||period==="d7"){
    const win=d[period], n=period==="d7"?"7":"30";
    val=win.v; series=period==="d7"?d.s.slice(23):d.s;
    if(win.d===null){ dl={txt:`new metric — no prior ${n}-day base`,cls:"flat"}; tgtCls="neutral"; tgtTxt=`${n}-day total`; good=null; }
    else{
      const up=win.d>=0;
      dl={txt:`${up?"↑":"↓"} ${Math.abs(win.d).toFixed(1)}% vs prior ${n} days`, cls:m.dir==="neutral"?"flat":(up?"up":"down")};
      if(m.dir==="neutral"){tgtCls="neutral";tgtTxt=`${n}-day total`;good=null;}
      else{tgtCls=up?"above":"below";tgtTxt=up?`▲ vs prior ${n}d`:`▼ vs prior ${n}d`;good=up;}
    }
  } else {
    const cur = period==="today"?d.today:d.s[d.s.length-1];
    const prev= period==="today"?d.s[d.s.length-1]:d.s[d.s.length-2];
    series = period==="today"?[...d.s,d.today]:d.s;
    if(period==="today"&&d.sync){
      val="syncing…"; dl={txt:"attribution pending in Cruva — fills in through the day",cls:"flat"};
      tgtCls="sync"; tgtTxt="SYNCING"; good=null; series=d.s;
    } else {
      val=m.fmt(cur);
      dl=deltaTxt(cur,prev,m.fmt,period==="today"?"vs yesterday full day":"vs day prior, Jul 14");
      const above=cur>=a;
      if(m.dir==="neutral"){tgtCls="neutral";tgtTxt=`avg ${m.fmt(r1(a))}`;good=null;}
      else{tgtCls=above?"above":"below";tgtTxt=(above?"▲ above":"▼ below")+" target";good=above;}
      sub=`target (30-day avg): ${m.fmt(r1(a))}`;
    }
    if(period==="yday"&&ydayLagged(m,seg)){ tgtCls="sync"; tgtTxt="SYNC-LAGGED *"; good=null; }
  }
  if(isBlendProd){ tgtCls="blend"; tgtTxt="BLENDED · shop"; }
  return `<div class="card${isBlendProd?" blend":""}">
    <div class="top"><h3>${m.label}</h3><span class="tgt ${tgtCls}">${tgtTxt}</span></div>
    <div class="val">${val}</div>
    <div class="delta ${dl.cls}">${dl.txt}</div>
    ${isBlendProd?`<div class="delta flat" style="margin-top:1px">shop-level — not split by product</div>`:(sub?`<div class="delta flat" style="margin-top:1px">${sub}</div>`:"")}
    ${srcLink(m.k)}
    ${spark(series,good,avg(series))}
  </div>`;
}
function heroHtml(seg, period){
  const m=SEG[seg].GMV, a=avg(m.s);
  let label,val,dl,badge,series;
  if(period==="d30"||period==="d7"){
    const win=m[period], n=period==="d7"?"7":"30", up=win.d>=0;
    label=period==="d7"?"TOTAL GMV — LAST 7 DAYS (JUL 9 – JUL 15)":"TOTAL GMV — LAST 30 DAYS (JUN 16 – JUL 15)";
    val=win.v; series=period==="d7"?m.s.slice(23):m.s;
    dl={txt:`${up?"↑":"↓"} ${Math.abs(win.d).toFixed(1)}% vs prior ${n} days`,cls:up?"up":"down"};
    badge=`<span class="tgt ${up?"above":"below"}" style="font-size:12px">${up?"▲ ABOVE":"▼ BELOW"} PRIOR ${n}-DAY PERIOD</span>`;
  } else if(period==="today"){
    label="TOTAL GMV — TODAY, JUL 16 (PARTIAL, AS OF 5:00 PM CT)"; series=m.s;
    val="syncing…";
    dl={txt:"GMV attribution pending in Cruva — fills in through the day",cls:"flat"};
    badge=`<span class="tgt sync" style="font-size:12px">SYNCING — 5:00 PM PULL, PARTIAL DAY</span>`;
  } else {
    label="TOTAL GMV — YESTERDAY, JUL 15"; val=money(m.s[29]); series=m.s;
    dl=deltaTxt(m.s[29],m.s[28],money,"vs Tuesday, Jul 14");
    const above=m.s[29]>=a;
    badge=`<span class="tgt ${above?"above":"below"}" style="font-size:12px">${above?"▲ ABOVE":"▼ BELOW"} 30-DAY AVG TARGET (${money(r1(a))})</span>`;
  }
  const good = dl.cls==="up"?true:(dl.cls==="down"?false:null);
  return `<div>
      <div class="label">${label}</div>
      <div class="big">${val}</div>
      <div class="delta ${dl.cls}" style="font-size:14px">${dl.txt}</div>
      <div style="margin-top:8px">${badge}</div>
      <div style="margin-top:8px"><a class="src" href="https://app.cruva.com" target="_blank" rel="noopener">source: Cruva ↗</a> · <a class="src" href="https://seller-us.tiktok.com/compass/data-overview?shop_region=US" target="_blank" rel="noopener">cross-check: TikTok Analytics ↗</a></div>
    </div>
    <div class="hero-side">${spark(series,good,avg(series),110)}</div>`;
}
const periodDesc={
  today:"Today — Thursday, July 16, 2026 (partial, as of 5:00 PM CT)",

function footHtml(seg,period){
  const base=`Pulled from Cruva (shop: Upper Echelon Products) on Thursday, July 16 at 5:00 PM CT.`;
  const prodNote = seg==="all"
    ? `<br>Video-attributed GMV = Affiliate GMV − LIVE GMV. Ad Spend, GMV Max Revenue and ROAS are shop-wide (Cruva doesn't split ad data by product).`
    : `<br><span class="tgt blend" style="font-size:11px">BLENDED</span> Ad Spend, GMV Max Revenue and ROAS can't be split by product in Cruva — those show the shop-wide number. Everything else is <strong>${PRODNAME[seg]}</strong> only. Video-attributed GMV = Affiliate − LIVE.`;
  let pn="";
  if(period==="today") pn=`<br><span class="note">Partial day: GMV, Affiliate, Video, LIVE, Orders and Views attribute on a lag and read SYNCING; they settle overnight. Videos, LIVEs, creators update in real time.</span>`;
  else if(period==="yday") pn=`<br><span class="note">* Cards marked SYNC-LAGGED were still 0 in Cruva at pull time and settle within ~24h. Jul 15 GMV, Affiliate, LIVE and Orders are synced; Video Views are not yet.</span>`;
  else if(period==="d7") pn=`<br>7-day deltas compare against the prior 7-day period (Jul 2 – Jul 8).`;
  else pn=`<br>30-day deltas compare against the prior 30-day period (May 17 – Jun 15).`;
  return base+prodNote+pn+`<br>Target = trailing 30-day daily average for the selected product. GMV Max Revenue is derived (spend × ROI).`;
}

};

function funnelHtml(op){
  const o=OUTREACH[op], n=op==="d7"?"7":"30";
  const dl=d=> d===null
    ? `<span class="delta flat" style="font-size:11.5px">new this period</span>`
    : `<span class="delta ${d>=0?'up':'down'}" style="font-size:11.5px">${d>=0?'↑':'↓'} ${Math.abs(d).toFixed(1)}% vs prior ${n}d</span>`;
  const cards=[
    ["DMs Sent", num(o.dms.v), "outreach messages sent", o.dms.d],
    ["Target-Collab Invites", num(o.tcInvites.v), "TC invites sent", o.tcInvites.d],
    ["Replies", num(o.replies.v), `${o.replies.rate}% reply rate`, o.replies.d],
    ["Sample Requests", num(o.sampleReq.v), "creators requesting product", o.sampleReq.d],
    ["Samples Approved", num(o.samplesApproved.v), `of ${num(o.sampleReq.v)} requested`, o.samplesApproved.d],
    ["Samples Delivered", num(o.samplesDelivered.v), "shipped to creators", o.samplesDelivered.d],
    ["GMV / Sample Delivered", money(o.gmvPerSample.v), "funnel efficiency", o.gmvPerSample.d],
  ];
  return cards.map(c=>`<div class="fcard"><div class="fl">${c[0]}</div><div class="fv">${c[1]}</div><div class="fs">${c[2]}</div><div style="margin-top:4px">${dl(c[3])}</div></div>`).join("");
}
function ofootHtml(op){
  return `Outreach funnel from <a class="src" href="https://app.cruva.com" target="_blank" rel="noopener">Cruva ↗</a> (${OUTREACH[op].win}, 2026), pulled Thursday, July 16 at 5:00 PM CT. Every metric is pulled per window and updates with the 7-/30-day toggle. <span class="note">The outreach push launched Jul 6, so the 30-day and 7-day totals are close — nearly all activity is recent. Replies (8) are the same in both windows for that reason.</span> Deep work stays in Cruva; this is the at-a-glance summary, and GMV / sample delivered is your best efficiency read.`;
}
function leadHtml(cp){
  const rows=CREATORS[cp].rows.map((r,i)=>{
    const [h,gmv,vids,d]=r;
    const dcell = d===null ? `<span class="delta flat">new</span>`
      : `<span class="${d>=0?'up':'down'}">${d>=0?'↑':'↓'} ${Math.abs(d).toFixed(0)}%</span>`;
    return `<tr><td class="rank">${i+1}</td><td class="hd">@${h}</td><td class="r">${money(gmv)}</td><td class="r">${vids}</td><td class="r">${dcell}</td></tr>`;
  }).join("");
  return `<table class="lead">
    <thead><tr><th class="rank">#</th><th>Creator</th><th class="r">GMV</th><th class="r">Videos</th><th class="r">vs prior period</th></tr></thead>

function cfootHtml(cp){
  const c=CREATORS[cp];
  const lagNote = c.lag
    ? `<br><span class="note">* Creator attribution lags ~3 days at the source — a Jul 9–15 window returns no data yet, so this leaderboard uses the freshest complete window, <strong>${c.win}</strong>. It catches up automatically.</span>`
    : "";
  return `Top creators by GMV from <a class="src" href="https://app.cruva.com" target="_blank" rel="noopener">Cruva ↗</a> (${c.win}, 2026), pulled Thursday, July 16 at 5:00 PM CT.${lagNote}<br>GMV is attributed across video + LIVE; a creator can show GMV with 0 videos in-window when sales come from LIVEs or earlier posts still converting. Manage relationships in Pipedrive; discover & mass-outreach in Cruva.`;
}
